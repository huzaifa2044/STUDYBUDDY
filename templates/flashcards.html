<!DOCTYPE html>
<html>
    <head>
        <title>Study Buddy</title>
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
<body>
    <div class="navbar">
        <div class="logo">📚 Study<span>Buddy</span></div>
        <div><a href="/">Home</a></div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>🗂️ Flashcards</h1>
        </div>

        {% if flashcards %}
            {% for card in flashcards %}
                <div class="card">
                    <strong>Front:</strong> {{ card.front }}<br>
                    <strong>Back:</strong> {{ card.back }}
                </div>
            {% endfor %}
        {% else %}
            <div class="section-card">
                <p>No notes loaded, or not enough content. Please go back and load notes first.</p>
            </div>
        {% endif %}

        <br>
        <a href="/" class="text-link">← Back to Home</a>
    </div>
</body>
</html>
