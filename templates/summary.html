<!DOCTYPE html>
<html>
    <head>
        <title>Study Buddy</title>
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
<body>
    <div class="navbar">
        <div class="logo">📚 Study<span>Buddy</span></div>
        <div><a href="/">Home</a></div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>📝 Summary</h1>
        </div>

        <div class="section-card">
            {% if summary %}
                <p>{{ summary }}</p>
            {% else %}
                <p>No notes loaded. Please go back and load notes first.</p>
            {% endif %}
        </div>

        <a href="/" class="text-link">← Back to Home</a>
    </div>
</body>
</html>
