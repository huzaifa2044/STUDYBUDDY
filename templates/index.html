<!DOCTYPE html>
<html>
    <head>
        <title>StudyWithBuddy</title>
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
<body>
    <div class="navbar">
        <div class="logo">
            <img src="{{ url_for('static', filename='logo.svg') }}" alt="StudyWithBuddy Logo">
            StudyWith<span>Buddy</span>
        </div>
        <div>
            <a href="/summary">Summary</a>
            <a href="/flashcards">Flashcards</a>
            <a href="/quiz">Quiz</a>
        </div>
    </div>

    <div class="container">

        <div class="hero">
            <h1>Study Smarter, Not Harder</h1>
            <p>Turn your notes into summaries, quizzes, and flashcards — instantly, offline, for free.</p>
            <div class="badge">Notes status: {{ status }}</div>
        </div>

        <div class="section-card">
            <h2>Load Your Notes</h2>
            <form action="/load" method="POST" enctype="multipart/form-data">
                <h3>Type your notes</h3>
                <textarea name="typed_notes" rows="6" placeholder="Paste or type your notes here..."></textarea>

                <h3>Or upload a .txt file</h3>
                <input type="file" name="notes_file">

                <button type="submit">Load Notes</button>
            </form>
        </div>

        <div class="feature-grid">
            <a href="/summary" class="feature-card">
                <div class="icon">📝</div>
                <div class="title">Generate Summary</div>
            </a>
            <a href="/flashcards" class="feature-card">
                <div class="icon">🗂️</div>
                <div class="title">Generate Flashcards</div>
            </a>
            <a href="/quiz" class="feature-card">
                <div class="icon">🎯</div>
                <div class="title">Generate Quiz</div>
            </a>
        </div>

    </div>
</body>
</html>
