<!DOCTYPE html>
<html>
    <head>
        <title>Study Buddy</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
<body>
    <div class="header-banner">
        <h1>Study Buddy</h1>
        <p>Your Personal Study Assistant</p>
    </div>

    <p><span class="status-box">Notes status: {{ status }}</span></p>

    <hr>

    <h2>Load Notes</h2>
    <form action="/load" method="POST" enctype="multipart/form-data">

        <h3>Option A: Type your notes</h3>
        <textarea name="typed_notes" rows="6" cols="60" placeholder="Type or paste your notes here..."></textarea>

        <h3>Option B: Upload a .txt file</h3>
        <input type="file" name="notes_file">

        <br><br>
        <button type="submit">Load Notes</button>
    </form>

    <hr>
    <h2>Features</h2>
    <a href="/summary">Generate Summary</a> |
    <a href="/flashcards">Generate Flashcards</a> |
    <a href="/quiz">Generate Quiz</a>

</body>
</html>
