<!DOCTYPE html>
<html>
    <head>
        <title>Study Buddy</title>
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
<body>
    <div class="navbar">
        <div class="logo">📚 Study<span>Buddy</span></div>
        <div><a href="/">Home</a></div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>🎯 Quiz</h1>
        </div>

        {% if quiz %}
            <div class="section-card">
                <form action="/quiz/submit" method="POST">
                    {% for question in quiz %}
                        <p>
                            <strong>Q{{ loop.index }}:</strong> {{ question.question }}<br>
                            <input type="text" name="answer_{{ loop.index0 }}" placeholder="Your answer">
                            <input type="hidden" name="correct_{{ loop.index0 }}" value="{{ question.answer }}">
                        </p>
                    {% endfor %}
                    <input type="hidden" name="total_questions" value="{{ quiz|length }}">
                    <button type="submit">Submit Quiz</button>
                </form>
            </div>
        {% else %}
            <div class="section-card">
                <p>No notes loaded, or not enough content. Please go back and load notes first.</p>
            </div>
        {% endif %}

        <a href="/" class="text-link">← Back to Home</a>
    </div>
</body>
</html>
